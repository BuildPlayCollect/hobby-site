# .pages.yml: settings for Pages CMS, the browser editor (https://app.pagescms.org).
# It describes the article form you fill in. Each "field" here matches a line
# in an article's frontmatter (see src/content.config.ts).

media:
  input: public/images
  output: /images
  categories: [image]

content:
  - name: articles
    label: Articles
    type: collection
    path: src/content/articles
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, hobby, type, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Short description
        description: One sentence. Shown on article cards and in Google results.
        type: text
        required: true
      - name: hobby
        label: Hobby
        type: select
        required: true
        options:
          values:
            - name: beyblade
              label: Beyblade
            - name: tamiya
              label: Tamiya
            - name: keyboards
              label: Keyboards
            - name: tcg
              label: TCG
            - name: consoles
              label: Consoles
            - name: esports
              label: Esports
      - name: type
        label: Article type
        type: select
        required: true
        options:
          values:
            - name: history
              label: History
            - name: brand-profile
              label: Brand Profile
            - name: guide
              label: Guide
            - name: where-to-buy
              label: Where to Buy
            - name: new-release
              label: New Release
            - name: giveaway
              label: Giveaway
            - name: interview
              label: Interview
      - name: author
        label: Author
        type: string
        default: Echo
        required: true
      - name: date
        label: Publish date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: featured
        label: Feature on the home page
        type: boolean
        default: false
      - name: cover
        label: Cover image
        type: image
      - name: coverAlt
        label: Cover image description
        description: Describe the photo for readers using screen readers, e.g. "Three Beyblade X tops in a stadium".
        type: string
      - name: body
        label: Article
        type: rich-text
        options:
          format: markdown

  - name: wiki
    label: Wiki terms
    type: collection
    path: src/content/wiki
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, hobby]
      primary: title
      sort: [title]
    fields:
      - name: title
        label: Term
        description: Written exactly as it appears in articles, e.g. "Ratchet". Matching is case-sensitive.
        type: string
        required: true
      - name: hobby
        label: Hobby
        description: The term is only auto-linked in articles from this hobby.
        type: select
        required: true
        options:
          values:
            - name: beyblade
              label: Beyblade
            - name: tamiya
              label: Tamiya
            - name: keyboards
              label: Keyboards
            - name: tcg
              label: TCG
            - name: consoles
              label: Consoles
            - name: esports
              label: Esports
      - name: summary
        label: One-line definition
        description: Shown when readers hover over the word, and at the top of the wiki page.
        type: text
        required: true
      - name: aliases
        label: Other spellings
        description: Other ways the term is written, e.g. "ratchets" or "Ratchets".
        type: string
        list: true
      - name: body
        label: Full explanation
        type: rich-text
        options:
          format: markdown

  - name: rules
    label: Tournament rules
    type: collection
    path: src/content/rules
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, hobby, scope, lastChecked]
      primary: title
      sort: [title]
    fields:
      - name: title
        label: Title
        description: e.g. "Beyblade X Rules (Manila community)"
        type: string
        required: true
      - name: hobby
        label: Hobby
        type: select
        required: true
        options:
          values:
            - name: beyblade
              label: Beyblade
            - name: tamiya
              label: Tamiya
            - name: keyboards
              label: Keyboards
            - name: tcg
              label: TCG
            - name: consoles
              label: Consoles
            - name: esports
              label: Esports
      - name: scope
        label: Official or local
        description: Local = rules from your community's own copy. Official = the organizer's rulebook.
        type: select
        required: true
        options:
          values:
            - name: local
              label: Local
            - name: official
              label: Official
      - name: organizer
        label: Who made these rules
        description: The community, shop or organizer, e.g. "Manila Beyblade Community".
        type: string
        required: true
      - name: sourceUrl
        label: Link to the full rules (optional)
        type: string
      - name: version
        label: Version or date of the rules (optional)
        type: string
      - name: lastChecked
        label: Last checked
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: summary
        label: One-line summary
        type: text
        required: true
      - name: body
        label: Rules
        type: rich-text
        options:
          format: markdown
